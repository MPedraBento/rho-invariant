[project]
name = "rho-invariant"
version = "0.1.0"
description = "A weights-only gauge invariant (rho) that predicts attention-head positional capacity without a forward pass"
readme = "README.md"
authors = [
    { name = "Anonymous" }
]
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "scikit-learn>=1.4.0",
    "tqdm>=4.66.0",
    "safetensors>=0.4.0",
    "huggingface-hub>=0.20.0",
    "accelerate>=1.14.0",
    "datasets>=5.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "ipython>=8.0.0",
    "jupyter>=1.0.0",
]

[build-system]
requires = ["uv_build>=0.9.8"]
build-backend = "uv_build"

[tool.uv]
index-url = "https://pypi.org/simple/"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
